name: Publicar estado

on:
  schedule:
    # GitHub no garantiza la hora exacta: en la práctica corre cada 5–15 min.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # solo para el keepalive de abajo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: node --test 'test/*.test.mjs'

      - name: Generar página con datos de Better Stack
        env:
          BETTERSTACK_TOKEN: ${{ secrets.BETTERSTACK_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # En repos públicos GitHub desactiva los workflows programados tras 60 días sin
      # actividad. Volver a habilitarlo una vez al día reinicia ese contador.
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" \< "0030" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/status.yml/enable"
          fi
